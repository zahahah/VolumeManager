on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  pull_request:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Build
        run: ./gradlew assembleDebug assembleRelease

      - name: Prepare APK artifacts
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk volume-manager-debug.apk
          if [[ -n "$KEYSTORE_FILE" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_FILE" | base64 -d > "$RUNNER_TEMP/volume-manager.jks"
            build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            "$build_tools/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk volume-manager-release.apk
            "$build_tools/apksigner" sign \
              --ks "$RUNNER_TEMP/volume-manager.jks" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD \
              volume-manager-release.apk
            "$build_tools/apksigner" verify volume-manager-release.apk
            rm -f "$RUNNER_TEMP/volume-manager.jks"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: volume-manager-*.apk
